[project]
name = "repo-documenter-adk"
version = "0.2.0"
description = "Google ADK repository README generator with human review and approval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[db]",
    "tree-sitter-language-pack",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.1.9",
    "asyncpg>=0.32.0",
]

[tool.uv]
package = false
