[project]
name = "agentic-ai-code-documentor"
version = "0.1.0"
description = "Agentic ai code documenter"
readme = "README.md"
authors = [
    { name = "san4net", email = "san4net@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "google-adk>=2.14.1",
]

[project.scripts]
agentic-ai-code-documentor = "agentic_ai_code_documentor:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
